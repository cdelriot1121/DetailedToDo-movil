name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # O la rama por defecto que utilices
  workflow_dispatch: # Permite ejecutar el flujo manualmente desde GitHub

# Establece los permisos del GITHUB_TOKEN para permitir la implementación en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite una sola implementación simultánea
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Google Sign-In client ID
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: |
          if [ -z "$GOOGLE_WEB_CLIENT_ID" ]; then
            echo "::error::Define GOOGLE_WEB_CLIENT_ID in repository Actions variables."
            exit 1
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path

          index_file = Path("web/index.html")
          html = index_file.read_text()
          marker = "REPLACE_WITH_GOOGLE_WEB_CLIENT_ID"
          if marker not in html:
              raise SystemExit(f"Missing {marker} in {index_file}")
          index_file.write_text(html.replace(marker, os.environ["GOOGLE_WEB_CLIENT_ID"]))
          PY

      - name: Build Web Application
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: |
          flutter build web --release --base-href "/${{ github.event.repository.name }}/" --dart-define="API_BASE_URL=$API_BASE_URL" --dart-define="GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
