name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main # Cambia 'main' por 'master' si tu rama principal se llama así

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web
        # IMPORTANTE: Reemplaza 'detailed_to_do' con el nombre exacto de tu repositorio en GitHub
        # si se aloja en una subruta. Si usas un dominio personalizado o un repositorio raíz, bórralo.
        run: flutter build web --release --base-href "/detailed_to_do/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
